# SIM PROFILE overlay (WILLY_PROFILE=sim) — deep-merged onto object.yaml.
# GroundingDINO for the sim real-vision (M2) path: downloaded from HF (local:false) on first run.
# Only the objectdetector entry diverges; `detector`/`rtdetr` are inherited from the base file.
objectdetector:
  model_path: ""
  model_id: "IDEA-Research/grounding-dino-tiny"
  threshold: 0.2
  local: false
  optim:
    # The validated M2 baseline runs with torch_dtype + attn UNSET: the detector loads native fp32 weights
    # and its autocast(dtype=None) => fp16-autocast compute — full recall on the small (~46 px) overhead
    # cube. The production base is torch_dtype:auto (=fp16 WEIGHTS on CUDA), which DROPS the cube (MEASURED:
    # torch_dtype:"float32" took M2 8/10 -> 0/3 on-box; only the unset path reproduces the baseline). A
    # `null` overlay leaf would KEEP the base "auto" (deep-merge contract), so use the loader's reset
    # sentinel "__null__" to force the field back to unset. channels_last off (memory-format, inert).
    torch_dtype: "__null__"
    attn_implementation: "__null__"
    channels_last: false
