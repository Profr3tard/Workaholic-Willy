# Workaholic-Willy — runtime tuning for app-level services.
#
# These values are operator-tunable. They control memory footprint,
# UX timing, and image-stream quality. They are NOT safety-critical:
# editing them cannot move the robot. Validation is performed by
# `backend/config/schema/app.py` on every load.

runtime:
  event_hub:
    buffer_size: 512               # ring-buffer depth per run (events)
    subscriber_queue_size: 256     # per-WebSocket asyncio queue size
    slow_subscriber_threshold: 3   # backpressure hits before disconnect
    heartbeat_interval_s: 2.5      # WS keep-alive cadence

  decision_images:
    capacity: 16                   # max cached decision JPEGs
    ttl_s: 300.0                   # eviction age in seconds

  interaction:
    prompt_timeout_s: 300.0        # operator prompt timeout
    confirm_timeout_s: 300.0       # operator confirmation timeout
    confirm_watchdog_s: 30.0       # warn-still-waiting after this many s

  run_registry:
    recent_limit: 50               # completed runs kept in memory

  image_encoding:
    frame_quality: 60              # JPEG quality for live frame stream
    decision_quality: 75           # JPEG quality for decision previews