objectdetector:
  # GroundingDINO for the sim real-vision (M2) path: downloaded from HF (local: false) on first run.
  # optim left at the conservative defaults (torch_dtype: null => fp32): the validated M2 8/10 baseline
  # ran fp32, and fp16 drops the confidence of the small (~46 px) overhead cube below threshold.
  model_path: ""
  model_id: "IDEA-Research/grounding-dino-tiny"
  threshold: 0.2
  local: false
  optim:
    torch_dtype: null
    attn_implementation: null
    channels_last: false
    compile: false
    compile_mode: reduce-overhead
