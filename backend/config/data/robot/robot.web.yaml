robot:
  vendor: kuka
  kuka:
    model: kr6-r900
    controller: krc4
    dof: 6
    transport: eki
    controller_ip: 192.168.1.90
    eki:
      role: server
      host: 0.0.0.0
      port: 7100
      timeout_s: 5.0
      heartbeat_s: 0.5
      buffer_size: 65536
  safety:
    dwell:
      dwell_after_stop_s: 1.0
