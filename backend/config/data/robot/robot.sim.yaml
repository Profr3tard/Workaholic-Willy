# Robot configuration for the ISAAC SIM validation cell (loaded by backend.src.willy_sim via
# load_config(data_dir=backend/config/data_sim)). Deliberately separate from the UR-default tree
# in backend/config/data so the sim never perturbs the production robot config.
#
# Everything willy_sim used to hardcode now lives here under robot.sim.*; values are UNCHANGED
# from the validated M1/M2/EIH runs (just sourced from config). Other robot.* sub-blocks fall back
# to schema defaults.
robot:
  vendor: "sim"

  sim:
    enabled: true
    mock_mode: false
    backend: "isaac"
    scene: null
    # Combined UR5e + Robotiq 2F-85 articulation (one root prim); gripper shares the same prim.
    robot_prim_path: "/World/UR5e"
    gripper_prim_path: "/World/UR5e"
    gripper_variant: "Robotiq_2f_85"          # USD Gripper variant selection on the ur5e asset
    calibration_target_prim_path: "/World/CalibrationMarker"
    home_joint_positions: [0.0, -1.0, 0.9, 0.0, 0.0, 0.0]
    park_joint_positions: [3.14, -1.0, 0.9, 0.0, 0.0, 0.0]   # arm swung to -X, clear of overhead cam
    tcp_offset_mm: 132.0                        # flange -> 2F-85 grasp-centre (measured on-box)
    assets_root: "D:/isaacsim_assets/Assets/Isaac/5.1"
    headless: true
    reset_on_connect: true

    cameras:
      overhead:                                # eye-to-hand fixed cam, 1 m above the workspace
        prim_path: "/World/Cameras/Overhead"
        mounting_mode: "eye_to_hand"
        position_mm: [450.0, 0.0, 1000.0]
        resolution: [640, 480]
        near_clip_m: null                      # M1 GT path keeps the 1.0 m default; M2 vision sets 0.05 itself
      wrist:                                   # eye-in-hand wrist cam (child of wrist_3_link)
        prim_path: "/World/UR5e/wrist_3_link/wrist_cam"
        mounting_mode: "eye_in_hand"
        resolution: [640, 480]
        near_clip_m: 0.02                       # close-range; avoids the 1.0 m black-RGB clip
        # Mount in the wrist-link LOCAL frame: offset to the side + look STRAIGHT DOWN parallel to
        # the gripper (aim X == offset X) so the gripper stays out of frame.
        mount_offset_mm: [130.0, 20.0, 0.0]
        mount_aim_mm:    [130.0, 457.0, 0.0]
        mount_up_hint:   [0.0, -1.0, 0.0]
      # Multi-view: two FIXED eye-to-hand obliques, one per side, so occlusion from EITHER side / the
      # arm reaching in from EITHER approach is covered by at least one view (two-sided redundancy, measured
      # in run_occlusion_probe). Authored + consumed ONLY by run_multiview_pick (build_combined_scene authors
      # just "overhead", so these are inert for M1/M2/EIH/dense -> byte-identical). For a fixed eye-to-hand
      # camera, mount_aim_mm is reused as the WORLD-frame look-at target (the bin centre); near_clip 0.05 m
      # because the side view sits closer than the overhead (the 1.0 m default would clip it to black).
      oblique_L:
        prim_path: "/World/Cameras/ObliqueL"
        mounting_mode: "eye_to_hand"
        position_mm: [450.0, -560.0, 720.0]
        mount_aim_mm: [450.0, 0.0, 50.0]
        resolution: [640, 480]
        near_clip_m: 0.05
      oblique_R:
        prim_path: "/World/Cameras/ObliqueR"
        mounting_mode: "eye_to_hand"
        position_mm: [450.0, 560.0, 720.0]
        mount_aim_mm: [450.0, 0.0, 50.0]
        resolution: [640, 480]
        near_clip_m: 0.05

    scene_setup:
      object:   { size_mm: [30.0, 30.0, 50.0], position_mm: [450.0, 0.0, 25.0], mass_kg: 0.05, static_friction: 1.5, dynamic_friction: 1.3 }
      table:    { size_mm: [800.0, 800.0, 400.0], position_mm: [450.0, 0.0, -200.0] }
      marker:   { kind: "none", position_mm: [450.0, -150.0, 6.0], aruco_plate_size_mm: 72.0, aruco_marker_id: 0 }
      eih_viewpoints: { radii_mm: [235.0, 275.0], elevations_deg: [16.0, 30.0], azimuths_deg: [0.0, 60.0, 120.0, 180.0, 240.0, 300.0] }
      gate:     { lift_threshold_mm: 50.0, pass_fraction: 0.8 }
      render_warmup_steps: 20

  # Cartesian workspace box (mm) for the sim cell. Spans the calibration viewpoints + ETH pose
  # generator (tool high over the table) AND the LOW grasp poses (grasp-centre TCP ~z=37 at the cube;
  # z_min must include these or the SafetyPreflight WorkspaceGuard rejects every grasp — z_min was 100,
  # which excluded the picks). z_min=0 = the table top; the 20 mm safety margin then floors at z=20.
  workspace_limits:
    x_min: 100.0
    x_max: 700.0
    y_min: -350.0
    y_max: 350.0
    z_min: 0.0
    z_max: 600.0

  # Retreat/safe pose — MUST sit inside workspace_limits (the SafetyPreflight WorkspaceGuard gates the
  # retreat-to-safe motion on that box). The schema default (0, -300, 400) is outside this cell's
  # x[100,700], so override it here (tool-down, high, off the -Y side, clear of the picks at x=450).
  safe_pose:
    x: 450.0
    y: -300.0
    z: 400.0

  # SafetyPreflight is wired into the sim pick path. The sim arm IS a UR5e, but the joint-limit
  # guard keys its bundled vendor table by MODEL ('ur5e') — for vendor='sim' (model 'isaac-sim') there
  # is no bundled table, so the guard fails closed (UNAVAILABLE) without explicit limits. Give it the
  # UR5e +/-360 deg/axis factory envelope so valid grasps pass while out-of-envelope joints are caught.
  safety:
    joint_limits:
      min_deg: [-360.0, -360.0, -360.0, -360.0, -360.0, -360.0]
      max_deg: [360.0, 360.0, 360.0, 360.0, 360.0, 360.0]
    # The whole ik_quality + motion_continuity family is sized for a SERVO drive: an IK jump is an
    # unfollowable discontinuity, and the singularity checks (condition_number / min_singular_value)
    # guard against Jacobian VELOCITY amplification near a singularity. The sim `move_joint` INTERPOLATES
    # (0.03 rad/step, up to 250 steps -> ~7.5 rad walked smoothly) and is POSITION-controlled + move()
    # FK-verifies the achieved TCP, so NONE of those servo failure modes exist here: large single-move
    # reconfigs (home->grasp ~113 deg wrist) and near-singular grasp configs are physically safe to drive.
    # -> widen the jump / step / singularity limits to the drive's real capability (still rejecting true
    # IK-garbage: condition > 1000, sigma < 1e-4, a wildly wrong branch). Measured: real-vision M2 picks
    # land condition up to ~365 + min_sigma ~7e-4 on awkward-but-valid configs. (Deep-merge keeps unlisted
    # fields at defaults.) Per-cell only; UR/production thresholds are untouched, and the workspace /
    # joint-limit / self-collision / payload guards remain strict.
    ik_quality:
      max_jump_rad: 3.5
      max_condition_number: 1000.0
      min_singular_value: 0.0001
    motion_continuity:
      max_joint_step_deg: 180.0
      max_orientation_step_deg: 180.0
      max_tcp_step_mm: 1000.0
    dwell:
      # The sim's wait_until_steady STEPS the physics; calling it as a pre-move gate inside the pick loop
      # conflicts with the loop's own stepping and breaks the picks (measured m1 0/10). On real hardware
      # wait_until_steady READS a controller steady signal (no stepping) so the gate works there. The
      # steady gate is therefore disabled for the sim cell (mechanism validated by mock + real hw).
      require_steady_before_motion: false
    # Self-collision: the Coal mesh backend is now the STANDARD check (Tim, 2026-06-28). RATIONALE: the
    # CAPSULE guard over-rejects the UR5e reach-down grasps (~30 mm link_2|link_5 false positives — why it was
    # off), and relying on Isaac PHYSICS / "the picks looked fine" was UNSAFE: the demo had CLEAR collisions
    # that every pick reported as good. The only TRUSTWORTHY arm-vs-arm + arm-vs-gripper check is the
    # vertex-exact Coal mesh backend — so it is ON by default here (`backend: fcl` = Coal-preferred,
    # python-fcl fallback; natural grasps clear at ~19.6 mm > 10 mm, the flipped branch rejects at 0 mm).
    # CONSISTENCY TRADE-OFF (accepted): this needs Coal (or python-fcl) + the mesh bundle; on macOS/CI without
    # Coal the mesh check is unavailable, so the sim cell is no longer "test-clean alone" there.
    self_collision:
      backend: "fcl"
      kinematics_model: "ur5e"
      kinematics_base_yaw_deg: 180.0
      min_distance_mm: 10.0

  gripper:
    vendor: "robotiq"
    max_width_mm: 85.0          # Robotiq 2F-85 opening
    min_width_mm: 5.0

  calibration:
    quality_threshold_mm: 2.5
    speed_scale: 1.0            # sim has no speed governor
    settle_time_s: 0.5
    orientation_spread_deg: 15.0
    max_attempts_per_pose: 200
    quality_bands_mm:
      excellent: 1.0
      good:      2.5
      marginal:  5.0
