hand_eye:
  # Fixed-camera workflow: returns Transform(CAMERA -> BASE).
  eye_to_hand:
    enabled: false
    mode: "eye_to_hand"
    min_samples: 6
    min_distance_mm: 40.0
    min_angle: 10.0
    marker_length_mm: 50.0
    aruco_dict_name: "DICT_5X5_100"

  # Tool-mounted-camera workflow: returns Transform(CAMERA -> TOOL).
  eye_in_hand:
    enabled: true
    mode: "eye_in_hand"
    min_samples: 6
    min_distance_mm: 40.0
    min_angle: 10.0
    marker_length_mm: 50.0
    aruco_dict_name: "DICT_5X5_100"