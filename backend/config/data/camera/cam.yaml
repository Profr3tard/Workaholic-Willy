cameras:
  # ── Active-Mode ─────────────────────────────────────────────────────
  # auto : Scan all enabled rigs, pick whichever is currently reachable.
  #        Convenient during development, but slow on Windows because
  #        each probed index goes through every installed OpenCV backend.
  # rig  : Skip probing entirely, open exactly `active_rig_id`.
  #        Use this once you know your setup — huge startup speedup.
  active_mode: auto

  # Must be set when active_mode == "rig". Valid values:
  #   "webcam_main"   — two USB webcams forming a stereo pair
  #   "stereo_dev0"   — single side-by-side stereo device at index 0
  #   "stereo_dev3"   — single side-by-side stereo device at index 3
  #   "realsense_d435"— Intel RealSense RGB-D
  active_rig_id: null


  stereo_calibration:
    charuco_squares_x: 10
    charuco_squares_y: 7
    charuco_square_length_mm: 26.0
    charuco_marker_length_mm: 20.0
    frame_size: [1280, 720]
    rectify_alpha: 0.0
    marker_length_mm: 50.0
    aruco_dict_name: "DICT_5X5_100"

  rigs:
    # ── Webcam-Pair ─────────────────────────────────────
    - rig_id: webcam_main
      enabled: true
      source: webcam_pair

      frame_size: [1280, 720]
      fps: 30
      min_pairs: 10
      max_pairs: 40

      # OpenCV backend. 0 == CAP_ANY (tries every backend, slow on Win).
      # 700 == CAP_DSHOW (fast, works with most USB webcams on Windows).
      # 1400 == CAP_MSMF (modern Windows Media Foundation).
      backend: 700
      max_cam_scan: 3

      # Leave null to auto-detect in scan order (integrated webcams
      # are filtered out). Set explicit indices for deterministic runs.
      cam_left_id: 0
      cam_right_id: 1

      quality:
        prefer_uncompressed: false
        manual_exposure: null
        manual_gain: null
        manual_wb: null
        disable_auto_features: true
        warmup_frames: 5          # only used for actual recording
        fps_tolerance: 3.0

      calibration_paths:
        base_dir: calibration/webcam_main

    # ── Single Stereo Device (Index 0) ──────────────────
    - rig_id: stereo_dev0
      enabled: false
      source: single_device

      device_index: 0
      device_frame_size: [2560, 720]
      per_eye_frame_size: [1280, 720]
      fps: 30
      min_pairs: 10
      max_pairs: 40
      layout: horizontal
      crop_left: 0
      crop_right: 0
      crop_top: 0
      crop_bottom: 0

      # See webcam_main. 0 may enable better quality on some stereo
      # devices via native drivers; 700 gives the fastest enumeration.
      backend: 0
      allow_resize: true
      min_sharpness: null

      quality:
        prefer_uncompressed: false
        manual_exposure: null
        manual_gain: null
        manual_wb: null
        disable_auto_features: true
        warmup_frames: 5
        fps_tolerance: 3.0

      calibration_paths:
        base_dir: calibration/stereo_dev0

    # ── Single Stereo Device (Index 3) ──────────────────
    - rig_id: stereo_dev3
      enabled: false
      source: single_device

      device_index: 3
      device_frame_size: [2560, 720]
      per_eye_frame_size: [1280, 720]
      fps: 30
      min_pairs: 10
      max_pairs: 40
      layout: horizontal
      crop_left: 0
      crop_right: 0
      crop_top: 0
      crop_bottom: 0
      backend: 0
      allow_resize: true
      min_sharpness: null

      quality:
        prefer_uncompressed: false
        manual_exposure: null
        manual_gain: null
        manual_wb: null
        disable_auto_features: true
        warmup_frames: 30
        fps_tolerance: 3.0

      calibration_paths:
        base_dir: calibration/stereo_dev3

    # ── RGB-D Kamera (z.B. Intel RealSense D435) ────────
    - rig_id: realsense_d435
      enabled: false
      source: rgbd

      device_index: 0
      serial_number: null
      fps: 30
      backend: 0

      color_resolution: [1280, 720]
      depth_resolution: [1280, 720]
      align_depth_to_color: true

      rgbd_backend: realsense
      realsense:
        enable_emitter: true
        laser_power_mw: null
        visual_preset: null
        depth_units_m: null
        export_intrinsics: false
        post_processing:
          decimation: false
          spatial: true
          temporal: true
          hole_filling: false

      quality:
        prefer_uncompressed: false
        disable_auto_features: false
        warmup_frames: 15
        fps_tolerance: 3.0

      calibration_paths:
        base_dir: calibration/realsense_d435