objectdetector:
  model_path: "backend/src/models/detection/model"
  model_id: ""
  threshold: 0.4
  local: True
  optim:
    torch_dtype: auto          # fp16 on CUDA, fp32 elsewhere
    attn_implementation: "eager"  # use "flash_attention_2" if installed
    channels_last: true
    compile: false             # opt-in; can speed up after warm-up
    compile_mode: reduce-overhead

# Detection backend selection: "groundingdino" (open-vocab, prompt) | "rtdetr" (closed-set, no prompt).
detector: "groundingdino"

# RT-DETR closed-set detector (COCO classes, runs WITHOUT a prompt). Active when detector: "rtdetr".
rtdetr:
  model_path: ""
  model_id: "PekingU/rtdetr_r50vd"
  threshold: 0.4
  local: false
  optim:
    torch_dtype: auto
    attn_implementation: "eager"
    channels_last: true
    compile: false
    compile_mode: reduce-overhead
