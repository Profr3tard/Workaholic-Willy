cameras:

  stereo_calibration:
    charuco_squares_x: 10
    charuco_squares_y: 7
    charuco_square_length_mm: 26.0
    charuco_marker_length_mm: 20.0
    frame_size: [1280, 720]
    rectify_alpha: 0.0
    marker_length_mm: 50.0
    aruco_dict_name: "DICT_5X5_100"

  rigs:
    - rig_id: oblique_L
      enabled: false           # -> true once serial_number below is filled
      source: rgbd

      device_index: 0          # IGNORED once serial_number is set; kept for a single-camera fallback
      serial_number: null      # REQUIRED before enabling both rigs (see the header)
      fps: 30
      backend: 0

      color_resolution: [1280, 720]
      depth_resolution: [1280, 720]
      align_depth_to_color: true

      rgbd_backend: realsense
      realsense:
        enable_emitter: true
        laser_power_mw: null
        visual_preset: null
        depth_units_m: null
        export_intrinsics: false
        post_processing:
          decimation: false
          spatial: true
          temporal: true
          # A tilted view sees object SIDES at a steep angle, which is where a D435 drops depth. Hole
          # filling INVENTS surface, and the grasp-depth top-reference would then sample invented
          # geometry, so it stays off: an honest hole is a measurable signal (the perception exerciser
          # prints the hole fraction inside each mask); a filled hole is a confident wrong number.
          hole_filling: false

      quality:
        prefer_uncompressed: false
        disable_auto_features: false
        warmup_frames: 15
        fps_tolerance: 3.0

      calibration_paths:
        base_dir: calibration/oblique_L

    - rig_id: oblique_R
      enabled: false           # -> true once serial_number below is filled
      source: rgbd

      device_index: 1
      serial_number: null      # REQUIRED before enabling both rigs (see the header)
      fps: 30
      backend: 0

      color_resolution: [1280, 720]
      depth_resolution: [1280, 720]
      align_depth_to_color: true

      rgbd_backend: realsense
      realsense:
        enable_emitter: true
        laser_power_mw: null
        visual_preset: null
        depth_units_m: null
        export_intrinsics: false
        post_processing:
          decimation: false
          spatial: true
          temporal: true
          hole_filling: false

      quality:
        prefer_uncompressed: false
        disable_auto_features: false
        warmup_frames: 15
        fps_tolerance: 3.0

      calibration_paths:
        base_dir: calibration/oblique_R
