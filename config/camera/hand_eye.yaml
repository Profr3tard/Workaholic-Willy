hand_eye:
  # NOTE: these `enabled` flags are documentation only: no code reads them (verified). They record the
  # cell's intended posture. The September rig is two fixed eye-to-hand D435s, so eye_to_hand is the base
  # default; the sim overlay (hand_eye.sim.yaml) already sets eye_to_hand too. A wrist-camera cell flips
  # them back.
  # Fixed-camera workflow: returns Transform(CAMERA -> BASE).
  eye_to_hand:
    enabled: true
    mode: "eye_to_hand"
    min_samples: 6
    min_distance_mm: 40.0
    min_angle: 10.0
    marker_length_mm: 50.0
    aruco_dict_name: "DICT_5X5_100"

  # Tool-mounted-camera workflow: returns Transform(CAMERA -> TOOL).
  eye_in_hand:
    enabled: false
    mode: "eye_in_hand"
    min_samples: 6
    min_distance_mm: 40.0
    min_angle: 10.0
    marker_length_mm: 50.0
    aruco_dict_name: "DICT_5X5_100"