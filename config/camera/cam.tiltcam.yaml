# ============================================================================
# TILTED DUAL-D435 CAMERA RIG: the camera half of the September cell.
#
#   WILLY_PROFILE=ur3e,tiltcam        real UR3e cell with the tilted pair
#   WILLY_PROFILE=sim,ur3e,tiltcam    the same optics in Isaac
#
# PAIRED WITH `robot.tiltcam.yaml`, deliberately under the SAME profile name.
# That file places two eye-to-hand cameras at 70 deg elevation, 900 mm from the
# aim point, and authors their lens to a D435's 69.4 deg RGB FOV. THIS file is
# the other half: the two physical cameras those positions describe.
#
# Splitting them across two profiles would let a cell run the tilted GEOMETRY
# against a single-camera config, or vice versa, and neither side would notice.
#
# WHY THIS FILE HAD TO EXIST. The base `cam.yaml` ships exactly ONE RGB-D rig,
# disabled, with `serial_number: null`. The September cell is two D435s, so the
# rig it will actually run could not be expressed at all. `rigs` is a list and
# the loader REPLACES a list wholesale on merge, so this overlay states the
# cell's complete camera set rather than patching the base one.
#
# THE SERIALS ARE THE POINT. Two identical D435s on one bus can only be told
# apart by serial: `RealSenseRGBDStreamer` binds a device with
# `rs_config.enable_device(serial)` and, with no serial, takes whatever the SDK
# offers first, an enumeration order that is not stable across boots or
# replugs. Two cameras that swap identity do NOT fail. They produce a complete,
# plausible scene with left and right exchanged, every fused position mirrored
# about the rig axis, and the pick goes confidently to the wrong place.
#
# So both rigs ship DISABLED with null serials: the tree loads, and the moment
# you enable both without filling the serials the config REFUSES, with a message
# that says how to read them. That refusal is the feature.
#
#   BENCH STEP: read the serials, one line, with either camera unplugged first
#   if you want to be certain which is which:
#
#     rs-enumerate-devices -s
#     # or:
#     python -c "import pyrealsense2 as rs; print([d.get_info(rs.camera_info.serial_number) \
#       for d in rs.context().devices])"
#
#   Then set `serial_number` per rig and flip `enabled: true` on both.
#
# NAMING: the rig ids match the robot layer's camera keys (`oblique_L` /
# `oblique_R`) so the two halves read as one cell. Which physical camera is
# "left" is decided by the serial you put here, not by cable order.
#
# STATUS: (2)-analytical. The geometry mirrors robot.tiltcam.yaml; no D435 pair
# has ever been enumerated, calibrated or streamed by this repo.
# ============================================================================
cameras:
  rigs:
    - rig_id: oblique_L
      enabled: false           # -> true once serial_number below is filled
      source: rgbd

      device_index: 0          # IGNORED once serial_number is set; kept for a single-camera fallback
      serial_number: null      # REQUIRED before enabling both rigs (see the header)
      fps: 30
      backend: 0

      color_resolution: [1280, 720]
      depth_resolution: [1280, 720]
      align_depth_to_color: true

      rgbd_backend: realsense
      realsense:
        enable_emitter: true
        laser_power_mw: null
        visual_preset: null
        depth_units_m: null
        export_intrinsics: false
        post_processing:
          decimation: false
          spatial: true
          temporal: true
          # A tilted view sees object SIDES at a steep angle, which is where a D435 drops depth. Hole
          # filling INVENTS surface, and the grasp-depth top-reference would then sample invented
          # geometry, so it stays off: an honest hole is a measurable signal (the perception exerciser
          # prints the hole fraction inside each mask); a filled hole is a confident wrong number.
          hole_filling: false

      quality:
        prefer_uncompressed: false
        disable_auto_features: false
        warmup_frames: 15
        fps_tolerance: 3.0

      calibration_paths:
        base_dir: calibration/oblique_L

    - rig_id: oblique_R
      enabled: false           # -> true once serial_number below is filled
      source: rgbd

      device_index: 1
      serial_number: null      # REQUIRED before enabling both rigs (see the header)
      fps: 30
      backend: 0

      color_resolution: [1280, 720]
      depth_resolution: [1280, 720]
      align_depth_to_color: true

      rgbd_backend: realsense
      realsense:
        enable_emitter: true
        laser_power_mw: null
        visual_preset: null
        depth_units_m: null
        export_intrinsics: false
        post_processing:
          decimation: false
          spatial: true
          temporal: true
          hole_filling: false

      quality:
        prefer_uncompressed: false
        disable_auto_features: false
        warmup_frames: 15
        fps_tolerance: 3.0

      calibration_paths:
        base_dir: calibration/oblique_R
