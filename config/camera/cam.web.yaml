# Camera overlay for WILLY_PROFILE=web (a webcam-pair dev rig).
#
# This is a profile overlay: the loader deep-merges it onto cam.yaml, so it needs to state only what
# changes, not a full copy of the tree. It used to be a 133-line machine-generated clone of cam.yaml
# that re-stated 110 keys to change 2; that clone drifts silently the moment cam.yaml changes. The two
# real decisions: skip device probing and open exactly the webcam pair.
#
# (The profile name "web" is a historical misnomer: it is a webcam overlay, unrelated to the removed
# web API. Not renamed here because `sim,web` is the named regression case for the fix in 39c8e77.)
cameras:
  active_mode: rig
  active_rig_id: webcam_main
