# Sim profile overlay (WILLY_PROFILE=sim), deep-merged onto hand_eye.yaml.
# Hand-eye calibration tuning for the Isaac sim cell. marker_length_mm + aruco_dict_name are the
# Single source of truth for the rendered ArUco board (willy_sim builds a board to match). Values
# unchanged from the validated ETH/EIH calibration runs; only the diverging keys are listed.
hand_eye:
  # Eye-to-hand: fixed overhead camera, marker on the tool -> Transform(CAMERA -> BASE).
  eye_to_hand:
    enabled: true
    min_samples: 8
    min_distance_mm: 20.0
    min_angle: 8.0
    marker_length_mm: 48.0
    aruco_dict_name: "DICT_4X4_50"
  # Eye-in-hand: wrist camera, fixed marker -> Transform(CAMERA -> TOOL).
  eye_in_hand:
    enabled: true          # the sim validates BOTH ETH and EIH; base defaults this off for the ETH rig
    min_samples: 8
    min_distance_mm: 20.0
    min_angle: 8.0
    marker_length_mm: 48.0
    aruco_dict_name: "DICT_4X4_50"
