# ============================================================================
# BLOCK MEASUREMENT LAYER: grasping.decision, a profile layer, chained LAST.
#
#   WILLY_PROFILE=sim,decision      (or: --profile sim,decision)
#
# One of the twelve `grasping.*` blocks that ship `enabled: false`. All twelve
# are WIRED: the schema-enumerated wiring guard drives each flag differentially
# and measured 0 inert. Only `fusion` has ever been measured ON-BOX over the
# config boot path. This layer exists so the other eleven can be, ONE AT A TIME,
# with each number meaning exactly one thing.
#
# WHY A PROFILE AND NOT AN EDIT TO robot.yaml. A block that has not been measured
# must not become anyone's default, and a block that HAS been measured should be
# enabled deliberately, with its number in the commit that enables it. A profile
# layer keeps both true: nothing under `<default>` moves, every other runner and
# every existing gate stays byte-identical, and the measurement is reproducible
# by name months later rather than by remembering which line was toggled.
#
# WHAT `decision` IS. The AUTO gate: `DecisionEngine` decides whether the stack
# may execute a grasp autonomously, and it is FAIL-CLOSED: on real hardware an
# inconclusive verdict refuses the pick rather than attempting it. That is why it
# is first of the eleven: in September it is the block standing between a
# prompt and the arm moving, so it is the one whose behaviour we least want to
# meet for the first time on a real cell.
#
# Enabling it is expected to REDUCE the pick count, not raise it. A gate that
# never refuses is not a gate. The question this measurement answers is not "does
# the rate go up" but "does it refuse the right picks, and does it say why".
# Read `dense_decision` / `dense_auto_reason` in the calculator telemetry and the
# typed DecisionReport, not the lift count alone.
# ============================================================================

robot:
  grasping:
    decision:
      enabled: true
