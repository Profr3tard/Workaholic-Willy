# ============================================================================
# RL x datagen   --profile rl_datagen        (see .ai-memory/rl-datagen-arc.md)
#
# Turns the U-stack ON so a pick over a datagen scene emits the fifteen feature keys the offline RL
# ranking/candidate trainers read. Without this the trainers see `_project_feature(None) -> 0.0` for
# thirteen of fifteen and degenerate, which is exactly what happened on 2026-07-17 and cost a day.
#
# Mode is auto, and it is not a preference. Measured against the schema on 2026-08-19:
#
#     watchdog       apply_modes ('auto',)                      <- drift_severity, ood_flagged,
#                                                                  degraded_mode_active
#     uncertainty    ('auto', 'dense_clutter', 'dense_autonomous')
#     feasibility    ('auto', 'dense_clutter', 'dense_autonomous')
#     success_model  ('easy', 'auto', 'dense_clutter', 'dense_autonomous')
#     fusion         no mode gate
#     performance    no mode gate
#
# `watchdog` is auto-only, so `auto` is the single mode under which all fifteen features are
# reachable. Any other mode silently drops three of them to zero.
#
# The mode is not a config key: `grasping.mode` does not exist and the loader rejects it (measured).
# It is chosen where the service is built, so the runner passes GraspMode.auto. This is the
# `--mode` vs `--grasp-mode` trap from docs/grasping-config-reference.md section 3: a profile that looks
# complete can still run in the wrong mode, and then most of the blocks below are inert.
#
# This profile is for data generation, not for a cell. It enables blocks the shipped tree keeps off
# on purpose, and it is pointed at scenes on disk, not at a robot. Do not layer it onto `ursim` or a
# real profile.
# ============================================================================

robot:
  vendor: dummy

  gripper:
    vendor: "dummy"
    tool_frame:
      source: "willy"
      offset_mm: [0.0, 0.0, 132.0]
      rotation_quat_xyzw: [-0.70710678, 0.0, 0.0, 0.70710678]

  safety:
    payload:
      enforce: false        # a bare flange: nothing is bolted to a scene on disk

  grasping:
    # --- the feature producers --------------------------------------------------------------------
    decision:
      enabled: true         # the AUTO gate itself; also the source of decision_latency_ms

    # The one component with a measured advantage that had never scored a real candidate.
    # `held_jaw_v1` reaches AUROC 0.8947 out of fold on 13,788 rows across 863 object groups, against
    # a width-only baseline of 0.7769, and it shipped as the schema default with `enabled: false`.
    # It changes NO ordering and NO decision; it stamps `deep_ranker_*` telemetry saying what it would
    # have chosen. Turned on here, in the offline feature sweep, because that runs the real pick path
    # on CPU without an Isaac box.
    deep_ranker:
      enabled: true

    fusion:
      enabled: true         # the shadow voxel substrate
      # Measured, not guessed: on bin_000009 the wrist depth starts at 55 mm, below the shipped
      # 80 mm floor: the camera is close in these scenes. Left at 80 it would clip real surface off
      # the nearest view, which is the one with the best look at the target.
      depth_min_mm: 40.0
      geometry:
        enabled: true       # fuse each object across cameras and change the CANDIDATES
        # The one setting here that is a cost knob, and it is set for this profile only.
        # Measured 2026-08-19 on bin_000009: `_fused_scene` took 182.7 s of a 187 s pick, because
        # the overlap metric is chunked brute force over clouds it documents as "a few thousand
        # points at most", and one datagen object's cloud is 37,119 points. Decimating for the
        # Match decision only leaves the fused cloud the generator plans on at full resolution.
        # Default is 0.0 (off): no shipped cell is affected by this line existing.
        score_voxel_mm: 4.0
      # `cameras` stays empty on purpose. It is the config source `build_config_frame_resolvers`
      # normally builds resolvers from, and it is fail-closed on calibration artifacts. Datagen's
      # extrinsics live per scene in scene.json, and the wrist camera moves with the posed arm, so
      # they are not a cell constant at all. The runner supplies `camera_frame_resolvers` directly,
      # which is what the pick loop actually reads (verified at pick_loop.py:1712).

    uncertainty:
      enabled: true         # uncertainty_score, uncertainty_disagreement

    feasibility:
      enabled: true         # feasibility_score

    success_model:
      enabled: true         # predicted_success_probability (+ its shadow)

    performance:
      enabled: true         # ranking_latency_ms, fusion_latency_ms, decision_latency_ms

  # --- the behaviour policy -----------------------------------------------------------------------
  # `rl_shadow` is what builds the shadow router, and the router is what populates
  # `_candidate_log`, the per-candidate 15-key feature rows this whole arc is here to collect.
  # Without it the records carry no per-candidate features at all.
  #
  # The bootstrap that makes this non-circular: with no artifact paths set, the router falls back to
  # the committed baselines (v2_candidate / v3_ranking). Those are the degenerate policies that abstain
  # honestly, which is fine and in fact correct here. They are the behaviour policy: what generated
  # the data. Training a better one from data the old one produced is exactly what off-policy offline
  # RL is for, and the alternative (train on data the new policy chose) is the on-policy trap.
  # Named explicitly, because the schema refuses `rl_shadow` without `policy_id` + `artifact_path`.
  # That refusal is right and worth keeping: a cell running a shadow policy nobody can name is a cell
  # whose telemetry cannot be attributed afterwards. The implicit fallback to these same files exists
  # in `maybe_build_shadow_router`, and writing them out is strictly better than relying on it.
  rl:
    mode: "rl_shadow"
    policy_id: "v2_candidate_baseline_v1"
    artifact_path: "docs/baselines/rl_policies/v2_candidate_baseline_v1.json"
    ranking_artifact_path: "docs/baselines/rl_policies/v3_ranking_baseline_v1.json"
