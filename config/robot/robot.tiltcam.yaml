# ============================================================================
# Tilted dual-d435 CAMERA rig, a profile layer, chained after a robot layer.
#
#   WILLY_PROFILE=sim,ur3e,tiltcam
#
# Models the camera rig of the real cell instead of the sim's historical nadir
# view: two Intel RealSense D435s, both eye-to-hand, mounted off to the side and
# tilted roughly 70 degrees up from the table plane rather than hanging directly
# over the scene.
#
# It is a separate layer from the robot on purpose. Bringing up a new arm and
# changing the optics at the same time would make a pick-rate change
# uninterpretable: you could not tell the arm from the camera. Chained, the same
# robot can be run with either rig and the difference measured:
#
#   WILLY_PROFILE=sim,ur3e            nadir overhead  (control)
#   WILLY_PROFILE=sim,ur3e,tiltcam    tilted pair     (the real cell)
#
# What actually changes, and why it is not cosmetic:
#   * Silhouette != footprint. A tilted view sees object sides, so the top-down
#     assumption behind footprint-based grasp synthesis no longer holds exactly.
#   * Real parallax. Depth error projects into grasp position differently than it
#     does under a nadir view.
#   * The nadir CAMERA->BASE shortcut is invalid. `build_combined_scene` detects the
#     aim point and fits the true CV-optical extrinsic from Isaac's own projection
#     instead (the same oracle the validated oblique rigs use).
#   * Field of view. Isaac's default lens is narrower than a d435's 69.4 deg RGB
#     stream, so the sim has been framing a smaller slice of the table than the
#     real camera will. Stating hfov_deg authors the lens to match.
#
# Geometry: positions are derived, not hand-picked. They come from
# `camera_position_for_elevation` at elevation 70 deg, azimuth -/+90 deg,
# distance 900 mm from the aim point, and `willy_sim/harness/coverage.py`
# verifies at load time that the resulting cones actually contain the
# configured scene.
#
# Anchored on the UR3e cell's workspace centre (350, 0, 50). Chaining this onto a
# differently-anchored robot layer is allowed: the coverage audit reports whether
# the scene still falls inside the frame.
#
# Status: (2)-analytical. Elevation 70 deg and the 900 mm standoff are the stated
# intent for the Sept rig, to be replaced by measured mounting values once the real
# cameras are on their brackets.
# ============================================================================
robot:
  sim:
    cameras:
      # Camera A. Listed under both names on purpose: it is one physical camera,
      # and the single-view path looks up "overhead" while the multi-view path
      # looks up "oblique_L".
      overhead:
        position_mm: [350.0, -307.8, 895.7]
        mount_aim_mm: [350.0, 0.0, 50.0]      # setting an aim = author by look-at, not nadir
        mount_up_hint: [0.0, 0.0, 1.0]
        hfov_deg: 69.4                        # D435 RGB stream (datasheet)
        # Mandatory at this standoff: Isaac's 1.0 m default near clip sits behind a
        # camera 0.9 m from its target, so the whole frame would come back empty.
        # Consequence to keep in mind: the M1 ground-truth path relied on that 1.0 m
        # clip to hide the arm from the instance mask, so a tilted M1 run may see arm
        # links the nadir run did not.
        near_clip_m: 0.05
      oblique_L:
        position_mm: [350.0, -307.8, 895.7]
        mount_aim_mm: [350.0, 0.0, 50.0]
        hfov_deg: 69.4
        near_clip_m: 0.05
      # Camera B, the opposite side. Together with A this is the two-sided
      # redundancy the occlusion probe measured: the arm reaching in from either
      # approach still leaves the target visible to at least one view.
      oblique_R:
        position_mm: [350.0, 307.8, 895.7]
        mount_aim_mm: [350.0, 0.0, 50.0]
        hfov_deg: 69.4
        near_clip_m: 0.05
