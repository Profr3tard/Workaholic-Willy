# Sim profile overlay (WILLY_PROFILE=sim), deep-merged onto segmenting.yaml.
# Sam2 for the sim real-vision (M2) path: downloaded from HF (local:false) on first run.
# Only the segmenter entry diverges; `segmenter_backend`/`oneformer` are inherited from the base file.
segmenter:
  model_path: ""
  local: false
  optim:
    # Reset to the validated M2 baseline: torch_dtype + attn UNSET (native fp32 weights + fp16-autocast).
    # A `null` leaf would keep the production base "auto" (fp16 weights), so use the loader's reset
    # sentinel "__null__". channels_last off (numerically inert). See object.sim.yaml for the measured
    # 8/10 -> 0/3 regression that the unset path fixes.
    torch_dtype: "__null__"
    attn_implementation: "__null__"
    channels_last: false
