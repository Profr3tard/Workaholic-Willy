# Hand + gesture detection (MediaPipe): optional and standalone.
#
# Nothing in the grasp pipeline reads this. It is read when a caller builds a detector through
# `src.models.handdetection.factory`, or by that package's CLI:
#
#     python -m src.models.handdetection --check      # models present? mediapipe installed?
#     python -m src.models.handdetection --rig <id>   # locate a hand in the base frame
#
# Two things are not shipped and both fail closed with an actionable message rather than silently:
#   1. mediapipe itself: `pip install -r requirements/voice.txt`
#   2. the `.task` model bundles: operator download, URLs in the comments below. They are not
#      committed (binaries, and the operator chooses the revision); `.gitignore` keeps a local
#      download out of the index.
handdetect:
  # The hand-landmark bundle: 21 landmarks per hand, no gesture head. Smaller and faster than the
  # gesture bundle, and all that is needed when only the palm centre matters.
  # https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
  model_path: "assets/models/mediapipe/hand_landmarker.task"

  # Detect up to two hands. The 3-D HandFinder refuses any frame that does not contain exactly
  # one, so this is deliberately not 1: the second hand has to be seen in order to be refused.
  max_hands: 2

  # MediaPipe confidence floors. `threshold` is "is there a hand", `presence_threshold` is "is the
  # hand I was tracking still here", `tracking_threshold` is the frame-to-frame association.
  threshold: 0.5
  presence_threshold: 0.5
  tracking_threshold: 0.5

  # Our own depth sampling, not MediaPipe's. The disc around the palm centre whose median depth
  # becomes the hand's distance: too small and one dropout on skin loses the hand, too large and
  # it starts averaging in the wall behind the hand.
  palm_patch_radius_px: 15

  # How many valid depth pixels that disc must contain before its median is believed. Guards the
  # case where almost the whole patch dropped out and the few survivors are noise.
  min_depth_samples: 20

gesturedetect:
  # The canned gesture bundle. It embeds a hand landmarker, so it returns landmarks and gestures:
  # a cell that wants both should use this model alone rather than running two over one frame.
  # https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/latest/gesture_recognizer.task
  model_path: "assets/models/mediapipe/gesture_recognizer.task"

  max_hands: 2
  threshold: 0.5
  presence_threshold: 0.5
  tracking_threshold: 0.5

  # The score a thumbs-up must reach to be reported as one. Below it the answer is "no gesture",
  # not a low-confidence thumbs-up; a confirmation that fires at 0.2 is worse than none. Raise
  # it wherever a false confirmation costs something.
  min_gesture_confidence: 0.5
