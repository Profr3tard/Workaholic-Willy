objectdetector:
  model_path: "src/models/detection/model"
  model_id: ""
  threshold: 0.4
  local: True
  optim:
    torch_dtype: auto          # fp16 on CUDA, fp32 elsewhere
    attn_implementation: "eager"  # use "flash_attention_2" if installed
    channels_last: true
    compile: false             # opt-in; can speed up after warm-up
    compile_mode: reduce-overhead

# Detection backend selection: "groundingdino" (open-vocab, prompt) | "rtdetr" (closed-set, no prompt).
detector: "groundingdino"

# --- models.pipeline: pick a whole perception stack instead of assembling one ---
#
# Live, and deliberately set to the stack this repo has always run, so switching is an edit rather
# than an archaeology exercise. Every value below is the current behaviour: change one word to change
# the stack.
#
# Legal combinations are enforced at load time (fail-closed); an illegal one names what is legal:
#   zero_shot / grounded_sam  x {sam2, oneformer}
#   zero_shot / vlm           x {sam2, oneformer}
#   closed_set / rtdetr       x {sam2, oneformer}
pipeline:
  kind: zero_shot             # zero_shot = open vocabulary, prompt-driven | closed_set = fixed classes

  zero_shot:
    # grounded_sam = GroundingDINO grounds the phrase, the segmenter cuts the mask. The validated
    #                default: fast (~0.13 s per call), and reliable on plain noun phrases.
    # vlm          = Qwen3-VL grounds instead. Slower and far heavier, but it is the only route that
    #                handles negation, comparatives, relative clauses and non-English prompts. The
    #                phrase grounder does not fail on those: it returns a confident box for the
    #                wrong object, which is why the router exists.
    backend: grounded_sam

    # sam2      = promptable: one box in, one mask out. Validated on every sim pick to date.
    # oneformer = segments the whole image with its own trained vocabulary; the box then selects
    #             among the segments. Works on both backends (it takes a box exactly as sam2 does).
    #             Unmeasured against sam2 in this repo: a knob, not a recommendation.
    segmenter: sam2

    vlm:
      # Only consulted when backend: vlm. Measured on-box 2026-08-10 (RTX 5080): the 4B bf16
      # checkpoint loads in 7.1 s, holds 8.93 GB of VRAM, answers in ~1.3-1.7 s, and grounds at
      # IoU ~0.87 against known ground truth. The FP8 variant needs `compressed-tensors`, which the
      # validated Isaac environment does not have; read src/models/vlm/vlm_README.md first.
      model_id: "Qwen/Qwen3-VL-4B-Instruct"
      preload: false          # false = load on the first complex prompt | true = at cell build
      on_unavailable: refuse  # refuse = reject the pick | degrade = fall back to the phrase grounder,
                              # loudly logged. Refuse is the default because the fallback is wrong on
                              # exactly the prompts that reach this route.

  router:
    # true routes each prompt: plain English noun phrases to the phrase grounder, everything else
    # (German, negation, comparatives, spatial relations, ...) to the VLM. Requires backend: vlm.
    # Routing with nowhere better to send a hard prompt is a decision nothing can act on, so the
    # schema refuses that combination rather than accepting a knob that does nothing.
    # `python -m src.robot.safety.planning --doctor` and GET /v1/diagnostics/route?prompt=...
    # both show what a given prompt would do before you run a pick.
    enabled: false

# RT-DETR closed-set detector (COCO classes, runs without a prompt). Active when detector: "rtdetr".
rtdetr:
  model_path: ""
  model_id: "PekingU/rtdetr_r50vd"
  threshold: 0.4
  local: false
  optim:
    torch_dtype: auto
    attn_implementation: "eager"
    channels_last: true
    compile: false
    compile_mode: reduce-overhead
