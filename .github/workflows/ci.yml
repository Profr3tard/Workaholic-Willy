name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, because there is one dependency set. Everything the project needs
  # is in requirements.txt, so there is no install variant left to test
  # separately.
  #
  # The runner has no GPU and installs the CUDA wheels anyway: they import
  # without a device, so CI resolves the same set the workstation ships. What is
  # checked here is that the pin resolves and imports.
  #
  # The claim that the library imports no web framework, and that nothing under
  # src/ imports api/, is proven by AST scan in the test suite rather than by
  # leaving fastapi uninstalled. It therefore holds under this job as well.
  checks:
    name: Lint, type, test, soak
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Torch pin resolves and imports
        run: python -c "import torch, torchvision; print('torch', torch.__version__, '| cuda available:', torch.cuda.is_available())"

      - name: Ruff
        run: ruff check src config api datagen tests scripts/examples

      - name: Mypy
        run: mypy src config api datagen scripts/examples

      - name: Pytest and coverage
        run: |
          pytest tests \
            --cov=src \
            --cov=config \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Production soak gate
        # Deterministic synthetic soak and 12 key KPI gate; exit 0 only if all
        # pass. It checks telemetry and KPI consistency, not grasp quality.
        run: python -m src.robot.grasping.replay --soak-report

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: Security audit
        # Informational. It surfaces advisories in pinned third party packages
        # that cannot be patched here, without gating the build red.
        continue-on-error: true
        run: pip-audit --desc
