name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint · type · test · soak
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install (CUDA runtime + dev tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Torch pin resolves and imports (no GPU on the runner)
        run: python -c "import torch, torchvision; print('torch', torch.__version__, '| cuda available:', torch.cuda.is_available())"

      - name: Ruff (lint)
        run: ruff check backend datagen tests

      - name: Mypy (type check)
        run: mypy backend datagen

      - name: Pytest + coverage (fail-under 80%)
        run: |
          pytest tests \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: U12 production soak gate
        # Locks the U12 baseline against silent behavioral regressions.
        run: python -m backend.src.robot.grasping.replay --soak-report

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cpu
          path: coverage.xml

      - name: Security audit (pip-audit, informational)
        # Non-blocking: surfaces advisories in pinned third-party deps (e.g. torch/opencv) that we cannot patch upstream, without red-gating dev.
        continue-on-error: true
        run: pip-audit --desc

  # OPERATOR CONSOLE — `api/` package, in its own job.
  console:
    name: Operator console — lint · type · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install (dev tooling + the console's optional extra)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt -r requirements/api.txt

      - name: Ruff (lint)
        run: ruff check api

      - name: Mypy (type check)
        run: mypy api

      - name: Pytest (console surface + the import guard)
        # The guard runs in BOTH jobs by design: here it proves `api/` is the only
        # tree importing the framework, and in the primary job it proves the
        # library does not import it even when it is not installed at all.
        run: pytest tests/test_api_console.py tests/test_no_web_framework_import.py